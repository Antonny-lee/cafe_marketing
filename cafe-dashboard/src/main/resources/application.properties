spring.application.name=cafe-dashboard

spring.datasource.url=jdbc:postgresql://${PG_POOL_HOST}:${PG_POOL_PORT:5432}/${PG_POOL_DATABASE}?sslmode=require
spring.datasource.username=${PG_POOL_USER}
spring.datasource.password=${PG_POOL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 테이블은 load_data.py가 이미 만들어 둔 상태이므로 JPA가 스키마를 건드리지 않게 한다.

spring.thymeleaf.cache=false

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 공공데이터포털 - 국세청_사업자등록정보 진위확인 및 상태조회 서비스
nts.service-key=${NTS_SERVICE_KEY}
nts.base-url=https://api.odcloud.kr/api/nts-businessman/v1

# 개발용: true면 국세청 실제 검증을 건너뛰고 입력값을 그대로 인증 통과 처리한다. 실서비스 전환 시 false로.
app.biz-auth.mock=true

# OpenAI - 리뷰 감정분석 / 개선 인사이트 추출
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com/v1
openai.model=gpt-4o-mini

# 카카오맵 - 경쟁사 위치 지도
kakao.map-key=${KAKAO_MAP_KEY:}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000