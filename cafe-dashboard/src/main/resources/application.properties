spring.application.name=cafe-dashboard

spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST}:${ORACLE_PORT:1521}/${ORACLE_SERVICE_NAME}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 테이블은 load_data.py가 이미 만들어 둔 상태이므로 JPA가 스키마를 건드리지 않게 한다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 공공데이터포털 - 국세청_사업자등록정보 진위확인 및 상태조회 서비스
nts.service-key=${NTS_SERVICE_KEY}
nts.base-url=https://api.odcloud.kr/api/nts-businessman/v1

# OpenAI - 리뷰 감정분석 / 개선 인사이트 추출
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com/v1
openai.model=gpt-4o-mini
