<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${detail.store().name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1 th:text="${detail.store().name}">매장명</h1>
    <p class="muted" th:text="${detail.store().address}">주소</p>
    <p class="muted" th:text="${detail.store().subwayInfo}">지하철</p>

    <div class="card" style="margin-bottom:20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <button type="button" id="refreshBtn"
                th:attr="data-store-id=${detail.store().storeId}"
                style="padding:9px 18px; border:none; border-radius:8px; background:var(--accent-dark); color:#fff; font-weight:700; cursor:pointer;">
            최신 리뷰 · 태그 갱신
        </button>
    </div>

    <style>
        .wait-modal-overlay {
            position: fixed; inset: 0; background: rgba(36,29,20,0.55);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }
        .wait-modal-overlay.open { display: flex; }
        .wait-modal-card {
            background: var(--card); border-radius: 14px; padding: 34px 36px;
            max-width: 340px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(36,29,20,0.3);
        }
        .wait-spinner {
            width: 38px; height: 38px; margin: 0 auto 18px;
            border: 4px solid var(--border); border-top-color: var(--accent-dark);
            border-radius: 50%; animation: wait-spin 0.8s linear infinite;
        }
        @keyframes wait-spin { to { transform: rotate(360deg); } }
        .wait-modal-title { font-family:'Noto Serif KR', serif; font-weight:700; font-size:16px; margin-bottom:8px; }
        .wait-modal-sub { font-size:12.5px; color:var(--muted); line-height:1.6; min-height:2.6em; }
    </style>

    <div id="refreshModal" class="wait-modal-overlay">
        <div class="wait-modal-card">
            <div class="wait-spinner"></div>
            <div class="wait-modal-title">최신 리뷰 갱신 중이에요</div>
            <div class="wait-modal-sub" id="refreshModalStatus">잠시만 기다려 주세요...</div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            const btn = document.getElementById('refreshBtn');
            const modal = document.getElementById('refreshModal');
            const modalStatus = document.getElementById('refreshModalStatus');
            const storeId = btn.dataset.storeId;
            let polling = null;
            let pollCount = 0;
            const runningMessages = [
                '네이버 지도에서 최신 리뷰를 가져오고 있어요...',
                '새 리뷰와 태그를 정리하고 있어요...',
                '데이터베이스에 반영하고 있어요...'
            ];

            function render(data) {
                if (data.status === 'RUNNING') {
                    modalStatus.textContent = runningMessages[Math.min(pollCount, runningMessages.length - 1)];
                    pollCount++;
                } else if (data.status === 'DONE') {
                    modalStatus.textContent = '완료 — 새 리뷰 ' + (data.newReviews ?? 0) + '건, 태그 ' + (data.tagRows ?? 0) + '건 반영됐어요.';
                    btn.disabled = false;
                    clearInterval(polling);
                    setTimeout(() => location.reload(), 900);
                } else if (data.status === 'ERROR') {
                    modalStatus.textContent = '갱신에 실패했어요. 잠시 후 다시 시도해주세요.';
                    btn.disabled = false;
                    clearInterval(polling);
                    setTimeout(() => modal.classList.remove('open'), 1600);
                }
            }

            async function poll() {
                try {
                    const res = await fetch('/stores/' + storeId + '/refresh/status');
                    if (!res.ok) return;
                    render(await res.json());
                } catch (e) { /* 다음 폴링에서 재시도 */ }
            }

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                pollCount = 0;
                modal.classList.add('open');
                modalStatus.textContent = '갱신 시작 중...';
                const res = await fetch('/stores/' + storeId + '/refresh', { method: 'POST' });
                render(await res.json());
                polling = setInterval(poll, 2500);
            });
        })();
    </script>

    <div class="grid grid-3">
        <div class="card stat">
            <div class="num" th:text="${detail.avgRating() != null ? #numbers.formatDecimal(detail.avgRating(), 1, 2) : '-'}">-</div>
            <div class="label">평균 평점</div>
        </div>
        <div class="card stat">
            <div class="num" th:text="${detail.reviewCount()}">0</div>
            <div class="label">리뷰 수</div>
        </div>
        <div class="card stat">
            <div class="num" th:text="${#lists.size(detail.menus())}">0</div>
            <div class="label">메뉴 수</div>
        </div>
    </div>

    <style>
        .intro-card { border-left: 3px solid var(--accent); }
        .intro-text {
            font-size: 14.5px;
            line-height: 1.9;
            color: var(--ink);
            max-width: 680px;
            white-space: pre-line;
            letter-spacing: -0.1px;
        }
    </style>

    <div class="card section-title intro-card" th:if="${detail.intro() != null}">
        <h2>소개</h2>
        <p class="intro-text" th:text="${detail.intro().introText}">소개글</p>
    </div>

    <div class="card section-title" th:if="${!#lists.isEmpty(detail.aiBriefings())}">
        <h2>AI 브리핑</h2>
        <ul>
            <li th:each="b : ${detail.aiBriefings()}" th:text="${b.sentence}">문장</li>
        </ul>
    </div>

    <div class="card section-title">
        <h2>메뉴</h2>
        <table>
            <thead><tr><th>메뉴명</th><th>가격</th></tr></thead>
            <tbody>
            <tr th:each="m : ${detail.menus()}">
                <td th:text="${m.menuName}">메뉴명</td>
                <td th:text="${m.priceKrw != null ? #numbers.formatInteger(m.priceKrw, 1, 'COMMA') + '원' : m.priceNote}">가격</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card section-title" th:if="${!#lists.isEmpty(detail.tags())}">
        <h2>리뷰 키워드</h2>
        <div class="kw-cloud">
            <span class="kw-chip" th:each="tag, iter : ${detail.tags()}" th:classappend="${iter.index < 3} ? 'kw-top' : ''">
                <span th:text="${tag.id.tagText}">키워드</span>
                <span class="kw-n" th:text="${tag.mentionCount}">0</span>
            </span>
        </div>
        <p class="muted" style="font-size:11px; margin-top:12px; margin-bottom:0; line-height:1.5;"
           th:if="${detail.tags()[0].storeTotalParticipants != null}">
            네이버 지도에 개업 이후 누적된 방문자 키워드 투표 기준이에요 (총 <span th:text="${detail.tags()[0].storeTotalParticipants}">0</span>명 응답).
            위 리뷰 목록·워드클라우드는 최근 6개월치만 모은 것이라 두 숫자는 서로 다른 기준이에요.
        </p>
    </div>

    <div class="section-title" th:replace="~{fragments/layout :: wordcloud(${wordCloud}, null)}"></div>

    <div class="card section-title" th:each="entry : ${detail.infoBySection()}">
        <h2 th:text="${entry.key}">섹션</h2>
        <table>
            <tbody>
            <tr th:each="item : ${entry.value}">
                <td th:text="${item.itemText}">항목</td>
                <td class="muted" th:text="${item.detail}">상세</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card section-title">
        <h2>리뷰 (<span th:text="${detail.reviewCount()}">0</span>건)</h2>
        <table>
            <thead><tr><th>평점</th><th>날짜</th><th>방문시간</th><th>내용</th></tr></thead>
            <tbody>
            <tr th:each="r : ${detail.reviews().content}">
                <td class="badge-rating" th:text="${r.rating}">0</td>
                <td class="muted" th:text="${r.reviewDateText}">날짜</td>
                <td class="muted" th:text="${r.visitTime}">방문시간</td>
                <td th:text="${r.reviewText}">내용</td>
            </tr>
            </tbody>
        </table>
        <div class="pager">
            <a th:if="${detail.reviews().hasPrevious()}"
               th:href="@{'/stores/' + ${detail.store().storeId}(page=${detail.reviews().number - 1})}">← 이전</a>
            <span class="muted" th:text="(${detail.reviews().number} + 1) + ' / ' + ${detail.reviews().totalPages}">1 / 1</span>
            <a th:if="${detail.reviews().hasNext()}"
               th:href="@{'/stores/' + ${detail.store().storeId}(page=${detail.reviews().number + 1})}">다음 →</a>
        </div>
    </div>
</main>
</body>
</html>
